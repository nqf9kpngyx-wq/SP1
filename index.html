<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spansk — Sproğapp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { background:#E8E2D8; min-height:100vh; font-family:"Inter",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    *::-webkit-scrollbar { display:none; }
    * { scrollbar-width:none; }
    button { font-family:inherit; }
    select { font-family:inherit; }
    input,textarea { font-family:inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});


// icons.jsx — minimal stroke icons used across the Spansk app
// All icons take size + color props; default 24/currentColor

const Icon = ({ size = 24, color = 'currentColor', stroke = 1.75, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
       stroke={color} strokeWidth={stroke}
       strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);

const IconHome = (p) => (<Icon {...p}><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"/></Icon>);
const IconBook = (p) => (<Icon {...p}><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M4 4v13a3 3 0 0 0 3 3"/></Icon>);
const IconWords = (p) => (<Icon {...p}><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4"/><path d="M8 13h8M8 17h6"/></Icon>);
const IconUser = (p) => (<Icon {...p}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></Icon>);
const IconFlame = (p) => (<Icon {...p}><path d="M12 22c4.5 0 7-3 7-6.5 0-3-2-5.5-3.5-6 .3 1.5-.5 3-2 3 0-2 1-5-1.5-7.5-1 3-4 4-4 8 0 1.5.5 3 1.5 4-1.5-.5-2.5-1.5-2.5-3-1 1-2 2.5-2 4.5 0 3.5 2.5 6.5 7 6.5z"/></Icon>);
const IconPlay = (p) => (<Icon {...p}><path d="M7 5l12 7-12 7z" fill={p.color || 'currentColor'}/></Icon>);
const IconCheck = (p) => (<Icon {...p}><path d="M5 13l5 5 9-12"/></Icon>);
const IconX = (p) => (<Icon {...p}><path d="M6 6l12 12M18 6L6 18"/></Icon>);
const IconArrow = (p) => (<Icon {...p}><path d="M5 12h14M13 5l7 7-7 7"/></Icon>);
const IconBack = (p) => (<Icon {...p}><path d="M19 12H5M11 5l-6 7 6 7"/></Icon>);
const IconClose = (p) => (<Icon {...p}><path d="M6 6l12 12M18 6L6 18"/></Icon>);
const IconSpeaker = (p) => (<Icon {...p}><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></Icon>);
const IconMic = (p) => (<Icon {...p}><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></Icon>);
const IconLightning = (p) => (<Icon {...p}><path d="M13 3L4 14h6l-1 7 9-11h-6l1-7z"/></Icon>);
const IconLeaf = (p) => (<Icon {...p}><path d="M21 3c-9 0-15 5-15 12 0 3 2 6 5 6 7 0 12-6 12-15-3 1-7 4-9 8"/></Icon>);
const IconBrain = (p) => (<Icon {...p}><path d="M9 4a4 4 0 0 0-4 4v3a3 3 0 0 0-1 5 3 3 0 0 0 4 3 3 3 0 0 0 4 1V4z"/><path d="M15 4a4 4 0 0 1 4 4v3a3 3 0 0 1 1 5 3 3 0 0 1-4 3 3 3 0 0 1-4 1V4z"/></Icon>);
const IconHeadphones = (p) => (<Icon {...p}><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></Icon>);
const IconChat = (p) => (<Icon {...p}><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/></Icon>);
const IconStar = (p) => (<Icon {...p}><path d="M12 3l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></Icon>);
const IconChevron = (p) => (<Icon {...p}><path d="M9 6l6 6-6 6"/></Icon>);
const IconSearch = (p) => (<Icon {...p}><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></Icon>);

// Sun motif — used for streak/daily indicator. Rays animate.
const SunMotif = ({ size = 120, filled = 5, total = 5, color = '#C8553D', dim = '#E8D9C4' }) => {
  const rays = Array.from({ length: total }, (_, i) => {
    const a = (i / total) * Math.PI * 2 - Math.PI / 2;
    const r1 = size * 0.32, r2 = size * 0.46;
    const x1 = size/2 + Math.cos(a)*r1, y1 = size/2 + Math.sin(a)*r1;
    const x2 = size/2 + Math.cos(a)*r2, y2 = size/2 + Math.sin(a)*r2;
    return { x1, y1, x2, y2, on: i < filled };
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {rays.map((r, i) => (
        <line key={i} x1={r.x1} y1={r.y1} x2={r.x2} y2={r.y2}
              stroke={r.on ? color : dim} strokeWidth={size*0.04}
              strokeLinecap="round" />
      ))}
      <circle cx={size/2} cy={size/2} r={size*0.24}
              fill={filled > 0 ? color : dim} />
    </svg>
  );
};

Object.assign(window, {
  Icon, IconHome, IconBook, IconWords, IconUser, IconFlame, IconPlay,
  IconCheck, IconX, IconArrow, IconBack, IconClose, IconSpeaker, IconMic,
  IconLightning, IconLeaf, IconBrain, IconHeadphones, IconChat, IconStar,
  IconChevron, IconSearch, SunMotif,
});


// ══════════════════════════════════════════════════════════
// SECTION 1: SM-2 ENGINE + STORAGE
// ══════════════════════════════════════════════════════════

const DB = {
  get: (key, def = null) => { try { const v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); } catch { return def; } },
  set: (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
};

function sm2(card, quality) {
  // quality: 0=wrong, 3=hard, 4=good, 5=easy
  let ef = card.ef ?? 2.5;
  let interval = card.interval ?? 0;
  let reps = card.reps ?? 0;
  if (quality >= 3) {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps++;
  } else {
    reps = 0;
    interval = 1;
  }
  ef = Math.max(1.3, ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  const due = new Date();
  due.setDate(due.getDate() + interval);
  return { ef, interval, reps, due: due.toISOString().split('T')[0] };
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

function getDueCards(cards, progress) {
  const today = todayStr();
  return cards.filter(c => {
    const p = progress[c.id];
    if (!p) return true; // never seen
    return p.due <= today;
  });
}

function useAppState() {
  const [profile, setProfileRaw] = React.useState(() => DB.get('profile', {
    name: 'Laurids', level: 'A1', theme: 'terracotta',
    streak: 0, lastStudied: null, totalXP: 0, studyMinutes: 0,
    showLabels: true,
  }));
  const [wordProgress, setWordProgressRaw] = React.useState(() => DB.get('wordProgress', {}));
  const [gramProgress, setGramProgressRaw] = React.useState(() => DB.get('gramProgress', {}));
  const [sessionStats, setSessionStats] = React.useState(() => DB.get('sessionStats', {
    totalSessions: 0, totalCorrect: 0, totalWrong: 0, history: [],
  }));
  const [dailyPlan, setDailyPlanRaw] = React.useState(() => {
    const saved = DB.get('dailyPlan', null);
    if (saved && saved.date === todayStr()) return saved;
    return buildDailyPlan();
  });

  const saveProfile = (updates) => {
    const p = { ...profile, ...updates };
    setProfileRaw(p);
    DB.set('profile', p);
  };
  const saveWordProgress = (updates) => {
    const wp = { ...wordProgress, ...updates };
    setWordProgressRaw(wp);
    DB.set('wordProgress', wp);
  };
  const saveGramProgress = (updates) => {
    const gp = { ...gramProgress, ...updates };
    setGramProgressRaw(gp);
    DB.set('gramProgress', gp);
  };
  const saveDailyPlan = (plan) => {
    setDailyPlanRaw(plan);
    DB.set('dailyPlan', plan);
  };
  const recordSession = (correct, wrong, xp, minutes) => {
    const today = todayStr();
    const lastStudied = profile.lastStudied;
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];
    const newStreak = lastStudied === yesterdayStr || lastStudied === today
      ? (lastStudied === today ? profile.streak : profile.streak + 1)
      : 1;
    saveProfile({
      lastStudied: today, streak: newStreak,
      totalXP: (profile.totalXP || 0) + xp,
      studyMinutes: (profile.studyMinutes || 0) + minutes,
    });
    const stats = {
      ...sessionStats,
      totalSessions: (sessionStats.totalSessions || 0) + 1,
      totalCorrect: (sessionStats.totalCorrect || 0) + correct,
      totalWrong: (sessionStats.totalWrong || 0) + wrong,
      history: [...(sessionStats.history || []).slice(-29), { date: today, correct, wrong, xp }],
    };
    setSessionStats(stats);
    DB.set('sessionStats', stats);
  };

  // Compute today's XP
  const todayXP = React.useMemo(() => {
    const today = todayStr();
    return (sessionStats.history || [])
      .filter(h => h.date === today)
      .reduce((sum, h) => sum + (h.xp || 0), 0);
  }, [sessionStats]);

  return {
    profile, saveProfile,
    wordProgress, saveWordProgress,
    gramProgress, saveGramProgress,
    dailyPlan, saveDailyPlan,
    sessionStats, recordSession,
    todayXP,
  };
}

function buildDailyPlan() {
  return {
    date: todayStr(),
    steps: [
      { id: 'warmup', kind: 'Opvarmning', title: 'Repetér dine ord', meta: '3 min · SM-2 repetition', icon: '〜', state: 'pending', xp: 20 },
      { id: 'lesson', kind: 'Dagens lektion', title: 'Nyt ordforråd', meta: '8 min · 5 øvelser', icon: '☕', state: 'locked', xp: 40 },
      { id: 'dictation', kind: 'Lyt og skriv', title: 'Diktat', meta: '4 min · transskription', icon: '♪', state: 'locked', xp: 20 },
    ],
  };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n) { return shuffle(arr).slice(0, n); }

function makeVocabQuestion(word, allWords, direction = 'es→da') {
  const distractors = shuffle(allWords.filter(w => w.id !== word.id)).slice(0, 3);
  if (direction === 'es→da') {
    const options = shuffle([word.da, ...distractors.map(w => w.da)]);
    return { type: 'choice', wordId: word.id, prompt: word.es, promptSub: word.ex,
      options: options.map(o => ({ text: o, ok: o === word.da })) };
  } else {
    const options = shuffle([word.es, ...distractors.map(w => w.es)]);
    return { type: 'choice', wordId: word.id, prompt: word.da, promptSub: '',
      options: options.map(o => ({ text: o, ok: o === word.es })) };
  }
}

function makePairQuestion(words) {
  const chosen = pickRandom(words, 4);
  return { type: 'pair', pairs: chosen.map(w => ({ es: w.es, da: w.da, id: w.id })) };
}

function makeClozeQuestion(word) {
  const sentence = word.ex;
  const esWords = sentence.replace(/[¿¡]/g,'').split(/\s+/);
  const idx = esWords.findIndex(w => w.toLowerCase().replace(/[.,!?]/g,'') === word.es.toLowerCase().replace(/[.,!?]/g,''));
  if (idx === -1) {
    return { type: 'choice', wordId: word.id, prompt: word.da + ' på spansk?', promptSub: '',
      options: [word.es, word.es+'s', word.es.slice(0,-1), word.da].map(o => ({ text: o, ok: o === word.es })) };
  }
  const blank = [...esWords];
  blank[idx] = '___';
  return { type: 'cloze', wordId: word.id, sentence: blank.join(' '), answer: esWords[idx],
    translation: word.da, options: shuffle([esWords[idx], word.da, word.da+'s', word.es.slice(0,3)+'a']).slice(0,4).map(o => ({ text: o, ok: o === esWords[idx] })) };
}

function makeDictationQuestion(word) {
  return { type: 'dictation', wordId: word.id, target: word.ex, prompt: 'Lyt og skriv sætningen', hint: word.da };
}

function makeConjugationQuestion(verb, tense) {
  const conj = VERBS[verb]?.[tense];
  if (!conj) return null;
  const subjectIdx = Math.floor(Math.random() * 6);
  const correct = conj[subjectIdx];
  const distractors = shuffle(conj.filter((_, i) => i !== subjectIdx)).slice(0, 3);
  return {
    type: 'conjugation',
    verb, tense, subject: SUBJECTS[subjectIdx],
    tenseName: TENSE_NAMES[tense],
    options: shuffle([correct, ...distractors]).map(o => ({ text: o, ok: o === correct })),
    answer: correct,
  };
}

function generateWarmupSession(wordProgress, allWords) {
  const today = todayStr();
  const due = allWords.filter(w => {
    const p = wordProgress[w.id];
    if (!p) return false; // only review known words
    return p.due <= today;
  });
  const toReview = pickRandom(due.length ? due : allWords.slice(0, 20), Math.min(8, due.length || 8));
  return toReview.map(w => {
    const r = Math.random();
    if (r < 0.5) return makeVocabQuestion(w, allWords, 'es→da');
    return makeVocabQuestion(w, allWords, 'da→es');
  });
}

function generateLessonSession(wordProgress, allWords, profile) {
  const levelOrder = ['A1','A2','B1','B2'];
  const userLevel = profile.level || 'A1';
  const levelIdx = levelOrder.indexOf(userLevel);
  const eligibleLevels = levelOrder.slice(0, levelIdx + 1);
  const eligible = allWords.filter(w => eligibleLevels.includes(w.level));
  // Prefer unseen words
  const unseen = eligible.filter(w => !wordProgress[w.id]);
  const pool = unseen.length >= 4 ? pickRandom(unseen, 8) : pickRandom(eligible, 8);
  const questions = [];
  const pairWords = pickRandom(pool, 4);
  questions.push(makePairQuestion(pairWords));
  const remaining = pool.filter(w => !pairWords.find(p => p.id === w.id));
  remaining.slice(0, 3).forEach(w => questions.push(makeVocabQuestion(w, allWords)));
  const clozeWord = remaining[3] || pool[0];
  if (clozeWord) questions.push(makeClozeQuestion(clozeWord));
  return shuffle(questions);
}

function generateDictationSession(allWords) {
  const targets = pickRandom(allWords.filter(w => w.level === 'A1' || w.level === 'A2'), 3);
  return targets.map(w => makeDictationQuestion(w));
}

function generateDeepVerbSession(verbName, tense) {
  const verb = verbName || pickRandom(Object.keys(VERBS), 1)[0];
  const t = tense || pickRandom(['presente','indefinido','imperfecto','futuro','condicional','subjuntivo'], 1)[0];
  return Array.from({ length: 6 }, (_, i) => ({
    type: 'conjugation', verb, tense: t, tenseName: TENSE_NAMES[t],
    subject: SUBJECTS[i], answer: (VERBS[verb]?.[t] || [])[i] || '?',
    options: shuffle(VERBS[verb]?.[t] || ['?','??','???','????']).map(o => ({
      text: o, ok: o === (VERBS[verb]?.[t] || [])[i],
    })),
  })).filter(q => q.answer !== '?');
}

function generateGrammarSession(rule) {
  return rule.exercises.map(ex => ({
    type: 'grammar', ruleId: rule.id, prompt: ex.prompt,
    answer: ex.answer,
    options: ex.options.map(o => ({ text: o, ok: o === ex.answer })),
    explanation: rule.explanation,
  }));
}

// Adaptive level: check if user should level up/down
function checkAdaptiveLevel(profile, sessionStats) {
  const recent = (sessionStats.history || []).slice(-5);
  if (recent.length < 3) return null;
  const total = recent.reduce((s,h) => s + h.correct + h.wrong, 0);
  const correct = recent.reduce((s,h) => s + h.correct, 0);
  const accuracy = total > 0 ? correct / total : 0;
  const levels = ['A1','A2','B1','B2'];
  const idx = levels.indexOf(profile.level || 'A1');
  if (accuracy >= 0.85 && idx < levels.length - 1) return { newLevel: levels[idx + 1], direction: 'up' };
  if (accuracy < 0.60 && idx > 0) return { newLevel: levels[idx - 1], direction: 'down' };
  return null;
}

const PairExercise = ({ q, t, onAnswer, feedback }) => {
  const [matched, setMatched] = React.useState({});
  const [selES, setSelES] = React.useState(null);
  const [selDA, setSelDA] = React.useState(null);
  const [wrongFlash, setWrongFlash] = React.useState(false);
  const [answered, setAnswered] = React.useState(false);
  const daList = React.useMemo(() => shuffle(q.pairs.map(p => p.da)), [q]);

  React.useEffect(() => {
    if (selES && selDA) {
      const correct = q.pairs.find(p => p.es === selES)?.da === selDA;
      if (correct) {
        const m = { ...matched, [selES]: selDA };
        setMatched(m);
        if (Object.keys(m).length === q.pairs.length && !answered) {
          setAnswered(true);
          setTimeout(() => onAnswer(true, null, null), 500);
        }
      } else {
        setWrongFlash(true);
        setTimeout(() => setWrongFlash(false), 350);
      }
      setTimeout(() => { setSelES(null); setSelDA(null); }, 200);
    }
  }, [selES, selDA]);

  const cs = (sel, isMatched) => ({
    padding:'14px 10px', borderRadius:14, fontFamily:t.serif, fontSize:17,

    cursor: isMatched ? 'default' : 'pointer', opacity: isMatched ? 0.6 : 1,
    transition:'all 0.15s', display:'block', width:'100%', textAlign:'center',
  });

  return (
    <div style={{ transform:wrongFlash?'translateX(-4px)':'none', transition:'transform 0.1s' }}>
      <div style={{ fontFamily:t.sans, fontSize:12, color:t.muted, marginBottom:12, textAlign:'center' }}>

          {q.pairs.map(p => (
            <button key={p.es} disabled={!!matched[p.es]} onClick={() => setSelES(p.es)}
              style={cs(selES===p.es, !!matched[p.es])}>{p.es}</button>
          ))}
        </div>
        <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8 }}>
          {daList.map(da => {
            const m = Object.values(matched).includes(da);
            return (
              <button key={da} disabled={m} onClick={() => setSelDA(da)}
                style={cs(selDA===da, m)}>{da}</button>
            );
          })}

    </div>
  );
};

      setSpeaking(true);
      u.onend = () => setSpeaking(false);
      window.speechSynthesis.speak(u);
      setPlays(p => p + 1);
    }
  };

  const norm = (s) => s.toLowerCase().replace(/[.,!?¿¡]/g,'').replace(/\s+/g,' ').trim();

            border:'none', background:text.trim()?t.ink:t.border,

            fontSize:15, cursor:text.trim()?'pointer':'default' }}>

};

const GrammarExercise = ({ q, t, onAnswer, feedback }) => {
  const [picked, setPicked] = React.useState(null);
  return (
    <div>
      {q.explanation && !feedback && (
        <div style={{ background:t.primary+'15', border:`1px solid ${t.primary}33`,
          borderRadius:16, padding:'14px 16px', marginBottom:16,
          fontFamily:t.sans, fontSize:13, color:t.ink2, lineHeight:1.5 }}>
          <span style={{ color:t.primary, fontWeight:700 }}>Regel: </span>{q.explanation}
        </div>
      )}
      <div style={{ background:t.card, border:`1px solid ${t.border}`, borderRadius:20,
        padding:'20px', marginBottom:16, textAlign:'center' }}>
        <div style={{ fontFamily:t.serif, fontSize:20, color:t.ink, lineHeight:1.4 }}>{q.prompt}</div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
        {q.options.map((o, i) => {
          const isPicked = picked === i;
          const showResult = feedback != null && isPicked;
          return (
            <button key={i} disabled={!!feedback}
              onClick={() => { if (!feedback) { setPicked(i); onAnswer(o.ok, o.text, q.answer); }}}
              style={{ padding:'14px', borderRadius:14, textAlign:'center',
                background: showResult?(o.ok?'#E8F1E8':'#FBE9E5'):t.card,
                border:`1.5px solid ${showResult?(o.ok?'#3F8A4E':'#C8553D'):(isPicked?t.primary:t.border)}`,
                fontFamily:t.serif, fontSize:17, color:t.ink, cursor:feedback?'default':'pointer' }}>
              {o.text}
            </button>
          );
        })}
      </div>
    </div>
  );
};

// Speaks a word via Web Speech API
function speakSpanish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// SECTION 9: SESSION RUNNER (shared for all session types)
// ══════════════════════════════════════════════════════════

const SessionRunner = ({ questions, t, onComplete, title, subtitle, isDeep = false }) => {
  const [step, setStep] = React.useState(0);
  const [feedback, setFeedback] = React.useState(null);
  const [hearts, setHearts] = React.useState(isDeep ? null : 3);
  const [results, setResults] = React.useState([]);
  const resultsRef = React.useRef([]);
  const startTime = React.useRef(Date.now());

  if (!questions || questions.length === 0) {
    return <div style={{ padding:40, textAlign:'center', color:t.muted }}>Ingen spørgsmål tilgængelige.</div>;
  }

  const q = questions[step];
  const total = questions.length;

  const handleAnswer = (ok, givenAnswer, correctAnswer) => {
    if (feedback) return;
    if (!ok && !isDeep && hearts !== null) setHearts(h => Math.max(0, h - 1));
    setFeedback({ ok, correctAnswer: ok ? null : correctAnswer });
    const newResult = { qIdx: step, ok, wordId: q.wordId || q.ruleId, quality: ok ? 5 : 2 };
    resultsRef.current = [...resultsRef.current, newResult];
    setResults(resultsRef.current);
  };

  // Auto-advance pair exercises (no feedback bar)
  React.useEffect(() => {
    if (feedback && q && q.type === 'pair') {
      const timer = setTimeout(() => {
        setFeedback(null);
        if (step + 1 >= questions.length) {
          const allResults = resultsRef.current;
          const finalCorrect = allResults.filter(r => r.ok).length;
          const minutes = Math.round((Date.now() - startTime.current) / 60000) || 1;
          onComplete({ results: allResults, correct: finalCorrect, wrong: 0, minutes });
        } else {
          setStep(s => s + 1);
        }
      }, 600);
      return () => clearTimeout(timer);
    }
  }, [feedback, q]);

  const advance = () => {
    setFeedback(null);
    if (step + 1 >= total) {
      const allResults = resultsRef.current;
      const finalCorrect = allResults.filter(r => r.ok).length;
      const minutes = Math.round((Date.now() - startTime.current) / 60000) || 1;
      onComplete({ results: allResults, correct: finalCorrect, wrong: total - finalCorrect, minutes });
    } else {
      setStep(s => s + 1);
    }
  };

  const renderQ = () => {
    const props = { q, t, onAnswer: handleAnswer, feedback };
    if (q.type === 'choice' || q.type === 'grammar') return <ChoiceExercise {...props}/>;
    if (q.type === 'conjugation') return <ConjugationExercise {...props}/>;
    if (q.type === 'pair') return <PairExercise {...props}/>;
    if (q.type === 'dictation') return <DictationExercise {...props}/>;
    return <div>Ukendt øvelsestype</div>;
  };

  return (
    <div style={{ height:'100%', background:t.bg, display:'flex', flexDirection:'column', paddingTop:64 }}>
      {/* top bar */}
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'4px 18px 14px' }}>
        <div style={{ flex:1, height:10, background:t.border, borderRadius:999, overflow:'hidden' }}>
          <div style={{ width:`${(step/total)*100}%`, height:'100%',
            background:t.primary, borderRadius:999, transition:'width 0.3s' }}/>
        </div>
        {!isDeep && hearts !== null && (
          <div style={{ display:'flex', alignItems:'center', gap:4, fontFamily:t.sans,
            color:t.ink, fontWeight:700, fontSize:15, flexShrink:0 }}>
            <span style={{ color:hearts>0?'#E04B3C':t.muted, fontSize:18 }}>♥</span>
            <span>{hearts}</span>
          </div>
        )}
        {isDeep && (
          <span style={{ fontFamily:t.sans, fontSize:12, color:t.muted }}>
            {step+1}/{total}
          </span>
        )}
      </div>

      <div style={{ flex:1, overflow:'auto', padding:'8px 22px 20px' }}>
        <div style={{ fontFamily:t.sans, fontSize:12, letterSpacing:1.4,
          color:t.muted, fontWeight:700, textTransform:'uppercase', marginBottom:4 }}>
          {subtitle || (q.type === 'conjugation' ? 'Konjugation' : q.type === 'pair' ? 'Match' : q.type === 'dictation' ? 'Diktat' : 'Vokabular')}
        </div>
        <h2 style={{ margin:'8px 0 22px', fontFamily:t.serif, fontWeight:400,
          fontSize:q.type==='pair'?22:26, color:t.ink, lineHeight:1.2, letterSpacing:-0.3 }}>
          {q.type === 'pair' ? 'Match ord med betydning' :
           q.type === 'dictation' ? 'Lyt og skriv sætningen' :
           q.type === 'conjugation' ? `Bøj "${q.verb}"` :
           q.prompt || 'Vælg det korrekte svar'}
        </h2>
        {renderQ()}
      </div>

      {/* for pair: auto-advances, no feedback bar needed for correct */}
      {feedback && q.type !== 'pair' && (
        <FeedbackBar feedback={feedback} onAdvance={advance}
          isLast={step+1>=total} t={t}/>
      )}
    </div>
  );
};

                <div style={{ fontFamily:t.serif, fontSize:18, color:t.ink,

            display:'block', width:'100%', textAlign:'left',

            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>

                <div style={{ fontFamily:t.sans, fontSize:12, color:t.muted, marginTop:2 }}>{rule.subtitle}</div>

const WordsScreen = ({ go, theme: t, appState }) => {

    const matchSearch = !search || w.es.includes(search.toLowerCase()) || w.da.includes(search.toLowerCase());

    if (filter === 'Alle') return true;
    if (['A1','A2','B1','B2'].includes(filter)) return w.level === filter;

        </h1>
        {dueCount > 0 && (
          <div style={{ marginTop:10, display:'inline-flex', alignItems:'center', gap:6,
            padding:'6px 12px', borderRadius:999, background:t.primary+'15',

        <div style={{ display:'flex', alignItems:'center', gap:8,
          background:t.card, border:`1px solid ${t.border}`, borderRadius:14, padding:'10px 14px' }}>
          <IconSearch size={16} color={t.muted}/>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Søg ord..." style={{
              flex:1, border:'none', background:'transparent',
              fontFamily:t.sans, fontSize:15, color:t.ink, outline:'none' }}/>
        </div>
      </div>

          <div style={{ textAlign:'center', padding:40, color:t.muted, fontFamily:t.sans, fontSize:14 }}>

const WordRow = ({ w, t, progress }) => {
  const strength = progress ? Math.min(1, (progress.reps || 0) / 5) : 0;
  const due = progress?.due <= todayStr();
  return (
    <div style={{ background:t.card, border:`1px solid ${due?t.primary:t.border}`,
      borderRadius:18, padding:'14px 16px', marginBottom:8,
      display:'flex', alignItems:'center', gap:14 }}>

const FONT = '"Inter", -apple-system, system-ui, sans-serif';
const THEMES = {
  terracotta: {
    name:'Terracotta', bg:'#F6F3ED', card:'#FFFFFF', border:'#E5DFD3',
    ink:'#1A1F1F', ink2:'#3F4847', muted:'#8A847A',
    primary:'#B8513C', accent:'#D9A84A', serif:FONT, sans:FONT,
  },
  costa: {
    name:'Costa', bg:'#F2F3F0', card:'#FFFFFF', border:'#DEE0DA',
    ink:'#101820', ink2:'#3B4750', muted:'#7A8289',
    primary:'#26669C', accent:'#C99332', serif:FONT, sans:FONT,
  },
  noche: {
    name:'Noche', bg:'#141413', card:'#1E1D1B', border:'#2D2C29',
    ink:'#F0EDE5', ink2:'#C5BFB3', muted:'#857F73',
    primary:'#D17A4B', accent:'#D9B244', serif:FONT, sans:FONT,
  },
};

function App() {
  const appState = useAppState();
  const { profile, saveProfile, saveWordProgress, saveGramProgress,
          wordProgress, gramProgress, dailyPlan, saveDailyPlan, recordSession } = appState;

  const t = THEMES[profile.theme] || THEMES.terracotta;
  const [screen, setScreen] = React.useState('home');
  const [sessionData, setSessionData] = React.useState(null); // { questions, title, type, xpPer }
  const [lastResult, setLastResult] = React.useState(null);
  const [levelUpMsg, setLevelUpMsg] = React.useState(null);

  const go = (s) => setScreen(s);

  // Start a daily plan step
  const startPlanStep = (stepId) => {
    let questions, title, xpPer;
    if (stepId === 'warmup') {
      questions = generateWarmupSession(wordProgress, WORDS);
      title = 'Opvarmning';
      xpPer = 3;
    } else if (stepId === 'lesson') {
      questions = generateLessonSession(wordProgress, WORDS, profile);
      title = 'Nyt ordforråd';
      xpPer = 6;
    } else if (stepId === 'dictation') {
      questions = generateDictationSession(WORDS);
      title = 'Diktat';
      xpPer = 8;
    }
    if (!questions || questions.length === 0) return;
    setSessionData({ questions, title, type: stepId, xpPer: xpPer || 5 });
    setScreen('session');
  };

  // Start a deep training session
  const startDeep = (modeId, opts) => {
    let questions, title;
    if (modeId === 'verbs' || modeId === 'dm_verbs') {
      questions = generateDeepVerbSession(opts.verb, opts.tense);
      title = `${opts.verb} — ${TENSE_NAMES[opts.tense] || opts.tense}`;
    } else if (modeId === 'grammar' || opts.rule) {
      const rule = opts.rule || GRAMMAR_RULES[0];
      questions = generateGrammarSession(rule);
      title = rule.title;
    } else if (modeId === 'dm_vocab') {
      const due = getDueCards(WORDS, wordProgress);
      const pool = pickRandom(due.length ? due : WORDS.slice(0,20), 10);
      questions = pool.map(w => makeVocabQuestion(w, WORDS, Math.random()>0.5?'es→da':'da→es'));
      title = 'Glosehjørnet';
    } else if (modeId === 'dm_dict') {
      questions = generateDictationSession(WORDS).concat(generateDictationSession(WORDS));
      title = 'Lyt og skriv';
    } else if (modeId === 'dm_gram') {
      const rule = GRAMMAR_RULES[Math.floor(Math.random() * GRAMMAR_RULES.length)];
      questions = generateGrammarSession(rule);
      title = rule.title;
    } else {
      const pool = pickRandom(WORDS, 10);
      questions = pool.map(w => makeVocabQuestion(w, WORDS));
      title = 'Træning';
    }
    if (!questions || questions.length === 0) return;
    setSessionData({ questions, title, type: 'deep', xpPer: 4, isDeep: true });
    setScreen('session');
  };

  const handleSessionComplete = (result) => {
    const { results, correct, wrong, minutes } = result;
    const xp = Math.round((results || []).filter(r => r.ok).length * (sessionData.xpPer || 5));

    // Update SM-2 for words
    const wpUpdates = {};
    (results || []).forEach(r => {
      if (!r.wordId) return;
      const word = WORDS.find(w => w.id === r.wordId);
      if (!word) return;
      const prev = wordProgress[r.wordId] || {};
      wpUpdates[r.wordId] = sm2(prev, r.quality || (r.ok ? 5 : 2));
    });
    if (Object.keys(wpUpdates).length) saveWordProgress(wpUpdates);

    // Update plan steps
    if (['warmup','lesson','dictation'].includes(sessionData.type)) {
      const steps = dailyPlan.steps.map(s => {
        if (s.id === sessionData.type) return { ...s, state: 'done' };
        // Unlock next step
        if (s.state === 'locked') {
          const doneCount = dailyPlan.steps.filter(x => x.state === 'done' || x.id === sessionData.type).length;
          const myIdx = dailyPlan.steps.indexOf(s);
          if (myIdx <= doneCount) return { ...s, state: 'pending' };
        }
        return s;
      });
      saveDailyPlan({ ...dailyPlan, steps });
    }

    recordSession(correct, wrong, xp, minutes);

    // Adaptive level check
    const check = checkAdaptiveLevel(profile, {
      ...appState.sessionStats,
      history: [...(appState.sessionStats.history || []), { date: todayStr(), correct, wrong, xp }],
    });
    if (check) {
      saveProfile({ level: check.newLevel });
      setLevelUpMsg(check);
    }

    setLastResult({ correct, wrong, xp, minutes, title: sessionData.title });
    setScreen('complete');
  };

  const goRoute = (dest) => {
    if (dest === 'warmup') { startPlanStep('warmup'); return; }
    if (dest === 'lesson') { startPlanStep('lesson'); return; }
    if (dest === 'dictation') { startPlanStep('dictation'); return; }
    setScreen(dest);
  };

  let body;
  if (screen === 'home') {
    body = <HomeScreen go={goRoute} theme={t} appState={appState}/>;
  } else if (screen === 'session') {
    body = (
      <SessionRunner
        questions={sessionData?.questions || []}
        t={t}
        title={sessionData?.title}
        isDeep={sessionData?.isDeep}
        onComplete={handleSessionComplete}
      />
    );
  } else if (screen === 'complete') {
    body = (
      <CompleteScreen go={go} theme={t} sessionResult={lastResult}
        onReturn={() => { setLastResult(null); setScreen('home'); }}/>
    );
  } else if (screen === 'train') {
    body = <TrainScreen go={go} theme={t} appState={appState} onStartDeep={startDeep}/>;
  } else if (screen === 'words') {
    body = <WordsScreen go={go} theme={t} appState={appState}/>;
  } else if (screen === 'profile') {
    body = <ProfileScreen go={go} theme={t} appState={appState}/>;
  }

  const showTab = !['session','complete'].includes(screen);
  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    return (
      <div style={{ display:'flex', flexDirection:'column', height:'100dvh',
        background:t.bg, color:t.ink, fontFamily:FONT, position:'relative' }}>
        {levelUpMsg && (
          <div style={{ position:'fixed', top:20, left:'50%', transform:'translateX(-50%)',
            zIndex:9999, background:t.primary, color:'#fff', padding:'12px 20px',
            borderRadius:14, fontFamily:t.sans, fontSize:14, fontWeight:600,
            boxShadow:'0 4px 20px rgba(0,0,0,0.2)', whiteSpace:'nowrap' }}
            onClick={() => setLevelUpMsg(null)}>
            {levelUpMsg.direction === 'up' ? '⬆️' : '⬇️'} Niveau {levelUpMsg.direction === 'up' ? 'op' : 'ned'}: {levelUpMsg.newLevel}
          </div>
        )}
        <div style={{ flex:1, overflowY:'auto' }}>
          {body}
        </div>
        {showTab && <TabBar t={t} active={screen} go={go}/>}
      </div>
    );
  }

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center',
      minHeight:'100vh', background:'#E8E2D8', padding:'40px 20px', fontFamily:FONT }}>
      <IOSDevice width={402} height={874} dark={profile.theme === 'noche'}>
        <div style={{ height:'100%', display:'flex', flexDirection:'column', background:t.bg, color:t.ink }}>
          {levelUpMsg && (
            <div style={{ position:'absolute', top:80, left:'50%', transform:'translateX(-50%)',
              zIndex:9999, background:t.primary, color:'#fff', padding:'12px 20px',
              borderRadius:14, fontFamily:t.sans, fontSize:14, fontWeight:600,
              boxShadow:'0 4px 20px rgba(0,0,0,0.2)', whiteSpace:'nowrap' }}
              onClick={() => setLevelUpMsg(null)}>
              {levelUpMsg.direction === 'up' ? '⬆️' : '⬇️'} Niveau {levelUpMsg.direction === 'up' ? 'op' : 'ned'}: {levelUpMsg.newLevel}
            </div>
          )}
          <div style={{ flex:1, overflowY:'auto' }}>
            {body}
          </div>
          {showTab && <TabBar t={t} active={screen} go={go}/>}
        </div>
      </IOSDevice>

      {/* Settings panel (outside device) */}
      <div style={{ position:'fixed', top:20, right:20, zIndex:100 }}>
        <SettingsPanel t={t} profile={profile} saveProfile={saveProfile}/>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// SECTION 16: TAB BAR + SETTINGS PANEL
// ══════════════════════════════════════════════════════════

function TabBar({ t, active, go }) {
  const tabs = [
    { id:'home', label:'I dag', Icon:IconHome },
    { id:'train', label:'Træn', Icon:IconBrain },
    { id:'words', label:'Ord', Icon:IconWords },
    { id:'profile', label:'Profil', Icon:IconUser },
  ];
  return (
    <div style={{ margin:'24px 14px 28px', background:t.card, border:`1px solid ${t.border}`,
      borderRadius:24, padding:'10px 6px 12px',
      display:'flex', justifyContent:'space-around' }}>
      {tabs.map(({ id, label, Icon }) => {
        const isActive = id === active;
        return (
          <button key={id} onClick={() => go(id)} style={{
            border:'none', background:'transparent', cursor:'pointer',
            display:'flex', flexDirection:'column', alignItems:'center', gap:4,
            padding:'4px 12px', flex:1, color:isActive?t.primary:t.muted }}>
            <div style={{ position:'relative' }}>
              <Icon size={24} stroke={isActive?2:1.6}/>
              {isActive && <div style={{ position:'absolute', bottom:-6, left:'50%',
                transform:'translateX(-50%)', width:5, height:5,
                borderRadius:'50%', background:t.primary }}/>}
            </div>
            <span style={{ fontFamily:t.sans, fontSize:10,
              fontWeight:isActive?700:500, letterSpacing:0.4 }}>{label}</span>
          </button>
        );
      })}
    </div>
  );
}

function SettingsPanel({ t, profile, saveProfile }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div>
      <button onClick={() => setOpen(o=>!o)} style={{
        width:40, height:40, borderRadius:'50%', background:'rgba(255,255,255,0.9)',
        border:'1px solid rgba(0,0,0,0.1)', cursor:'pointer',
        display:'flex', alignItems:'center', justifyContent:'center',
        boxShadow:'0 2px 8px rgba(0,0,0,0.1)', fontSize:18 }}>⚙️</button>
      {open && (
        <div style={{ position:'absolute', top:48, right:0, width:220,
          background:'rgba(250,249,247,0.95)', backdropFilter:'blur(20px)',
          border:'1px solid rgba(0,0,0,0.1)', borderRadius:16,
          padding:'12px', boxShadow:'0 8px 32px rgba(0,0,0,0.15)',
          fontFamily:FONT }}>
          <div style={{ fontSize:12, fontWeight:700, color:'#666',
            letterSpacing:0.8, textTransform:'uppercase', marginBottom:8 }}>Tema</div>
          {Object.entries(THEMES).map(([key, th]) => (
            <button key={key} onClick={() => { saveProfile({ theme: key }); setOpen(false); }}
              style={{ display:'block', width:'100%', textAlign:'left',
                padding:'8px 10px', borderRadius:8, marginBottom:4, cursor:'pointer',
                background: profile.theme === key ? t.primary : 'transparent',
                color: profile.theme === key ? '#fff' : '#333',
                border: 'none', fontSize:14, fontWeight:500 }}>
              {th.name}
            </button>
          ))}
          <div style={{ borderTop:'1px solid rgba(0,0,0,0.08)', marginTop:8, paddingTop:8,
            fontSize:12, color:'#888', textAlign:'center' }}>
            Klik udenfor for at lukke
          </div>
        </div>
      )}
      {open && <div style={{ position:'fixed', inset:0, zIndex:-1 }} onClick={() => setOpen(false)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
</body>
</html>
